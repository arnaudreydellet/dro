 <section class="method" id="methodPanel"><div class="method-icon">✦</div><div><div class="method-title">LE REPÈRE À CONNAÎTRE</div><div class="method-text" id="methodText"></div></div></section>
 </div></main>

<div class="modal-backdrop" id="finishModal" aria-hidden="true"><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="finishTitle"><div class="modal-icon">✓</div><h2 class="modal-title" id="finishTitle">Mon travail est enregistré</h2><p class="modal-text" id="finishMessage"></p><div class="modal-actions"><button type="button" id="finishBack">Revenir aux activités</button><button type="button" class="modal-primary" id="finishExport">↓ Télécharger mes réponses</button></div></div></div><div class="toast" id="toast" role="status"></div>
<script>
'use strict';
// Données et graphiques fictifs, présentés uniquement à des fins de sciences appliquées.
// Cet atelier ne calcule aucun réglage, point d'impact ou distance d'emploi réelle.
const lessons=[
{phase:'DÉCOUVRIR',name:'Lire un document',title:'Lire une <em>fiche technique</em>',subtitle:'Identifier les grandeurs qui figurent sur une fiche de données fictive.',mins:8,steps:[
{id:'1a',kind:'fields',doc:'ficheA',title:'Prélever deux informations',body:'Observe les deux valeurs affichées sur la fiche. Dans les cases, <strong>recopie uniquement la valeur numérique</strong> de chaque grandeur. Les unités sont déjà indiquées à droite des cases.',fields:[['masse','Masse indiquée sur la fiche','g','Ex. 15','number'],['vitesse','Vitesse indiquée sur la fiche','m/s','Ex. 450','number']],method:'Sur un document technique, un nombre doit toujours être relié à une <strong>grandeur physique</strong> et à son <strong>unité</strong>.'},
{id:'1b',kind:'choice',doc:'ficheA',title:'Identifier la bonne grandeur',body:'Sur la fiche, la valeur est suivie de « m/s ». <strong>Que mesure cette unité ?</strong> Sélectionne une seule proposition.',options:['La masse','La vitesse','L’énergie cinétique','La distance'],method:'Le symbole <strong>m/s</strong> signifie « mètre par seconde » : il exprime une vitesse. Le symbole <strong>g</strong> exprime une masse.'},
{id:'1c',kind:'fields',doc:'ficheA',title:'Expliquer les données à un client',body:'Rédige <strong>deux phrases complètes</strong> : la première explique ce que mesure la masse ; la seconde explique ce que mesure la vitesse. Utilise les unités du document.',fields:[['masseDef','Phrase sur la masse','','La masse indique…','textarea'],['vitesseDef','Phrase sur la vitesse','','La vitesse indique…','textarea']],method:'Expliquer ne consiste pas seulement à recopier « 10 g » ou « 700 m/s » : il faut préciser ce que représente chacune des grandeurs.'}
]},
{phase:'DÉCOUVRIR',name:'Convertir les masses',title:'Convertir des <em>grammes en kilogrammes</em>',subtitle:'Préparer les valeurs avant d’utiliser une formule physique.',mins:12,steps:[
{id:'2a',kind:'fields',doc:'conversion',title:'Effectuer une première conversion',body:'Convertis <strong>10 g</strong> en kilogrammes. Entre le résultat dans la case. Tu peux utiliser une virgule ou un point décimal.',fields:[['v','10 g = … kg','kg','Ton résultat','number']],method:'Pour convertir des grammes en kilogrammes, on <strong>divise par 1 000</strong>. Exemple différent : 25 g = 25 ÷ 1 000 = 0,025 kg.'},
{id:'2b',kind:'fields',doc:'conversion',title:'Convertir une deuxième masse',body:'Même méthode, cette fois avec <strong>12 g</strong>. Écris le nombre de kilogrammes correspondant.',fields:[['v','12 g = … kg','kg','Ton résultat','number']],method:'Une masse exprimée en grammes ne peut pas être directement utilisée comme si elle était exprimée en kilogrammes dans la formule de l’énergie cinétique.'},
{id:'2c',kind:'fields',doc:'conversion',title:'Expliquer ta conversion',body:'Convertis <strong>8,5 g</strong> en kilogrammes, puis explique en une phrase l’opération que tu as réalisée.',fields:[['v','8,5 g = … kg','kg','Ton résultat','number'],['comment','J’explique ma méthode','','J’ai divisé…','textarea']],method:'Repère de grandeur : <strong>1 kg = 1 000 g</strong>. Le nombre en kilogrammes est donc 1 000 fois plus petit que le nombre en grammes.'}
]},
{phase:'COMPRENDRE',name:'Comprendre la formule',title:'Comprendre <em>l’énergie cinétique</em>',subtitle:'Reconnaître la formule, le rôle des variables et les unités.',mins:10,steps:[
{id:'3a',kind:'order',doc:'formula',title:'Remettre les étapes dans l’ordre',body:'Pour effectuer un calcul d’énergie cinétique, <strong>clique sur les actions dans l’ordre</strong> où tu les effectuerais. Chaque clic ajoute une étape à ta démarche.',items:['Calculer le carré de la vitesse','Préciser le résultat en joules','Convertir la masse en kilogrammes','Appliquer la formule avec les valeurs','Repérer les données du problème'],method:'Une résolution structurée commence par les <strong>données</strong>, puis vérifie les <strong>unités</strong>, effectue le calcul et termine par un résultat avec une unité.'},
{id:'3b',kind:'choice',doc:'formula',title:'Repérer la grandeur au carré',body:'Dans l’expression <strong>E₍c₎ = ½ × m × v²</strong>, quelle grandeur est élevée au carré ?',options:['La masse m','La vitesse v','L’énergie E₍c₎','Le nombre ½'],method:'L’écriture <strong>v²</strong> se lit « v au carré » et signifie <strong>v × v</strong>. L’énergie ne varie pas de la même façon que la vitesse.'},
{id:'3c',kind:'fields',doc:'formula',title:'Associer chaque unité à sa grandeur',body:'Sélectionne l’unité que tu utiliserais dans la formule pour chacune des trois grandeurs.',fields:[['m','Unité de la masse','','Choisir une unité','select',['g','kg','cm','m/s']],['v','Unité de la vitesse','','Choisir une unité','select',['J','m/s','g','s']],['e','Unité de l’énergie','','Choisir une unité','select',['N','m','J','m/s']]],method:'Les unités usuelles de la formule, dans le Système international, sont <strong>kg</strong> pour la masse, <strong>m/s</strong> pour la vitesse et <strong>J</strong> pour l’énergie.'}
]},
{phase:'CALCULER',name:'Calculer une énergie (A)',title:'Calculer une <em>énergie cinétique</em>',subtitle:'Appliquer la formule à un premier exemple fictif, sans sauter d’étape.',mins:16,steps:[
{id:'4a',kind:'fields',doc:'calcA',title:'Préparer la masse',body:'La fiche A indique une masse de <strong>10 g</strong>. Avant de calculer l’énergie, écris cette masse en <strong>kilogrammes</strong>.',fields:[['v','Masse à utiliser dans la formule','kg','Masse en kg','number']],method:'La conversion doit être faite <strong>avant</strong> la substitution dans E₍c₎ = ½ × m × v².'},
{id:'4b',kind:'fields',doc:'calcA',title:'Calculer le carré de la vitesse',body:'La vitesse de la fiche A est <strong>700 m/s</strong>. Calcule <strong>700 × 700</strong> et saisis le résultat numérique.',fields:[['v','700² = 700 × 700 = …','','Résultat du carré','number']],method:'Élever un nombre au carré signifie le multiplier <strong>par lui-même</strong>, pas le multiplier par 2.'},
{id:'4c',kind:'fields',doc:'calcA',title:'Obtenir l’énergie cinétique',body:'Utilise <strong>E₍c₎ = ½ × m × v²</strong>. Reprends tes résultats des deux étapes précédentes. Saisis l’énergie en joules, puis rédige ton calcul avec les valeurs.',fields:[['v','Énergie cinétique de la fiche A','J','Résultat en joules','number'],['detail','Je rédige mon calcul','','E₍c₎ = ½ × … × … = … J','textarea']],method:'Dans une résolution, indique toujours la <strong>formule littérale</strong>, puis la substitution numérique, puis le résultat accompagné de <strong>J</strong>.'}
]},
{phase:'CALCULER',name:'Calculer une énergie (B)',title:'Comparer <em>deux fiches fictives</em>',subtitle:'Refaire un calcul puis justifier une comparaison avec des nombres.',mins:14,steps:[
{id:'5a',kind:'fields',doc:'comparison',title:'Préparer les données de la fiche B',body:'La fiche B indique <strong>12 g</strong> et <strong>650 m/s</strong>. Convertis sa masse en kilogrammes et calcule le carré de sa vitesse.',fields:[['m','Masse B convertie','kg','Ton résultat','number'],['v2','650² = …','','Ton résultat','number']],method:'Deux fiches peuvent présenter des vitesses et des masses différentes : <strong>les deux grandeurs</strong> comptent dans l’expression de l’énergie.'},
{id:'5b',kind:'fields',doc:'comparison',title:'Calculer l’énergie de la fiche B',body:'Calcule maintenant l’énergie cinétique associée à la fiche B. Utilise les valeurs que tu viens de préparer.',fields:[['e','Énergie cinétique B','J','Énergie calculée','number'],['detail','Calcul rédigé','','½ × … × … = … J','textarea']],method:'Lorsque tu rédiges un calcul, vérifie que la masse utilisée est exprimée en <strong>kilogrammes</strong> et la vitesse en <strong>m/s</strong>.'},
{id:'5c',kind:'choiceText',doc:'comparison',title:'Comparer avec justification',body:'En te fondant sur <strong>tes deux calculs d’énergie</strong>, sélectionne la fiche dont l’énergie est la plus grande, puis justifie ta réponse par une phrase chiffrée.',options:['Fiche A','Fiche B','Les deux énergies sont égales'],fieldLabel:'Je justifie la comparaison',placeholder:'L’énergie de … est … car …',method:'Une vitesse plus grande ne suffit pas à conclure : il faut considérer <strong>la masse et le carré de la vitesse</strong>. Ce calcul n’indique pas à lui seul quel produit choisir.'}
]},
{phase:'EXPÉRIMENTER',name:'Faire varier la vitesse',title:'Observer l’effet du <em>carré de la vitesse</em>',subtitle:'Manipuler une expérience virtuelle puis calculer les variations.',mins:14,steps:[
{id:'6a',kind:'choiceText',doc:'slider',title:'Faire varier la vitesse',body:'Dans le graphique de gauche, <strong>déplace le curseur de vitesse</strong>. Observe la forme de la courbe. Choisis une description puis explique ce que tu constates.',options:['L’énergie augmente en ligne droite','L’énergie augmente suivant une courbe','L’énergie ne varie pas'],fieldLabel:'Ce que j’observe',placeholder:'Lorsque la vitesse augmente, je constate que…',method:'La relation théorique <strong>E₍c₎ = ½ × m × v²</strong> permet de voir pourquoi la courbe ne suit pas une variation linéaire lorsque m reste constante.'},
{id:'6b',kind:'fields',doc:'slider',title:'Faire un calcul sur un objet de laboratoire',body:'On étudie un <strong>objet fictif de laboratoire de 2 kg</strong> se déplaçant à <strong>10 m/s</strong>. Calcule son énergie cinétique. Ce cas est distinct des fiches de munitions.',fields:[['v2','10² = …','','Carré de la vitesse','number'],['e','Énergie cinétique','J','Résultat','number']],method:'Pour un objet de masse constante, la formule reste <strong>E₍c₎ = ½ × m × v²</strong>. Le graphique de gauche illustre uniquement cette loi physique.'},
{id:'6c',kind:'fields',doc:'slider',title:'Étudier un doublement de vitesse',body:'La vitesse du même objet passe de <strong>10 m/s à 20 m/s</strong>. Calcule son énergie à 20 m/s et le <strong>pourcentage d’augmentation</strong> par rapport à sa valeur initiale.',fields:[['e2','Énergie à 20 m/s','J','Ton résultat','number'],['pct','Augmentation de l’énergie','%','Ton pourcentage','number']],method:'Pour calculer un taux d’évolution : <strong>((valeur finale − valeur initiale) ÷ valeur initiale) × 100</strong>. Une valeur supérieure à 0 correspond à une augmentation.'}
]},
{phase:'INTERPRÉTER',name:'Lire des mesures',title:'Lire et construire <em>un graphique</em>',subtitle:'Exploiter une série de mesures fictives de laboratoire.',mins:12,steps:[
{id:'7a',kind:'fields',doc:'lab',title:'Prélever des données dans un tableau',body:'Le tableau présente quatre mesures de vitesse. Renseigne les vitesses relevées aux <strong>mesures B et D</strong>, sans oublier qu’elles sont exprimées en m/s.',fields:[['b','Vitesse à la mesure B','m/s','Valeur','number'],['d','Vitesse à la mesure D','m/s','Valeur','number']],method:'Pour lire un tableau, commence par identifier la <strong>ligne</strong>, la <strong>colonne</strong> et l’<strong>unité</strong>.'},
{id:'7b',kind:'fields',doc:'lab',title:'Calculer une diminution en pourcentage',body:'La vitesse passe de <strong>40 m/s à la mesure A</strong> à <strong>32 m/s à la mesure C</strong>. Calcule la diminution en m/s, puis le pourcentage de diminution par rapport à la mesure A.',fields:[['delta','Diminution de vitesse','m/s','Ton résultat','number'],['pct','Pourcentage de diminution','%','Ton résultat','number']],method:'Une diminution en pourcentage se calcule par <strong>(diminution ÷ valeur initiale) × 100</strong>. Précise bien la valeur de départ choisie.'},
{id:'7c',kind:'plot',doc:'plot',title:'Placer les quatre points du graphique',body:'Dans le graphique, <strong>sélectionne A, B, C ou D</strong>, puis clique à la hauteur correspondant à la vitesse du tableau. Répète l’opération pour placer les quatre mesures.',method:'Sur ce graphique, l’axe horizontal indique les <strong>mesures A à D</strong> ; l’axe vertical indique la <strong>vitesse en m/s</strong>. Tu places toi-même les points : aucune courbe-réponse n’est affichée.'}
]},
{phase:'INTERPRÉTER',name:'Comprendre la DRO',title:'Comprendre la <em>ligne de visée et la trajectoire</em>',subtitle:'Interpréter un schéma de principe, sans calculer de réglage réel.',mins:12,steps:[
{id:'8a',kind:'choice',doc:'trajectory',title:'Reconnaître la ligne de visée',body:'Sur le schéma, <strong>quelle couleur</strong> représente la ligne de visée rectiligne ?',options:['La courbe orange','La droite bleue','Le quadrillage gris'],method:'La <strong>ligne de visée</strong> est représentée ici par une droite. La <strong>trajectoire</strong> est représentée par une courbe. Le dessin n’a pas d’échelle réelle.'},
{id:'8b',kind:'mark',doc:'trajectory',title:'Repérer le point le plus haut',body:'Clique sur le schéma, à l’endroit où la <strong>trajectoire orange est la plus haute</strong> par rapport à la ligne de visée bleue. Un marqueur apparaît là où tu as cliqué.',fieldLabel:'Explique comment tu as repéré ce point',placeholder:'J’ai choisi ce point parce que…',method:'Sur ce schéma simplifié, le point le plus haut de la courbe est aussi celui où l’écart positif à la droite horizontale est le plus grand.'},
{id:'8c',kind:'mark',doc:'trajectory',title:'Identifier le deuxième croisement',body:'Clique maintenant sur <strong>le deuxième croisement</strong> entre la courbe orange et la droite bleue, en allant de gauche à droite. Puis explique le sens de ce croisement.',fieldLabel:'Ce que signifie le deuxième croisement',placeholder:'À ce point, la trajectoire…',method:'Dans le glossaire RWS, la <strong>DRO</strong> est définie par le deuxième croisement de la trajectoire avec la ligne de visée, sous une condition d’écart donnée. Ce schéma n’est <strong>pas</strong> un outil de réglage.'}
]},
{phase:'INTERPRÉTER',name:'Interpréter avec rigueur',title:'Distinguer <em>les faits et les conclusions</em>',subtitle:'Ne pas faire dire à un document technique ce qu’il ne prouve pas.',mins:10,steps:[
{id:'9a',kind:'classify',doc:'analysis',title:'Classer les affirmations',body:'Pour chaque phrase, indique si elle est <strong>justifiée par les données</strong> présentées ou si elle <strong>ne peut pas être conclue</strong> à partir de ces seules données.',items:['La fiche indique une masse en grammes.','La fiche indique une vitesse en mètres par seconde.','La seule valeur de l’énergie suffit à déterminer l’usage approprié du produit.','Le schéma suffit à obtenir un réglage réel sans mesure supplémentaire.'],method:'Une information relevée dans un document est un <strong>fait</strong>. Une conclusion doit être soutenue par des données suffisantes et ne pas dépasser ce qui est montré.'},
{id:'9b',kind:'choice',doc:'analysis',title:'Choisir la formulation la plus rigoureuse',body:'Un client demande ce qu’indique l’énergie d’une fiche technique. <strong>Quelle formulation est scientifiquement prudente ?</strong>',options:['L’énergie donne, à elle seule, toutes les informations utiles.','L’énergie représente une grandeur physique calculable à partir de la masse et de la vitesse.','L’énergie indique directement la distance maximale d’emploi.'],method:'L’énergie cinétique est une <strong>grandeur physique</strong>. À elle seule, elle ne permet pas de tirer toutes les conclusions concernant un usage précis.'},
{id:'9c',kind:'fields',doc:'analysis',title:'Rédiger une explication professionnelle',body:'Rédige un message clair de <strong>3 à 5 phrases</strong> expliquant à un client la différence entre masse, vitesse et énergie cinétique, sans donner de conseil de réglage ou de tir.',fields:[['exp','Mon explication au client','','La masse correspond à… La vitesse… L’énergie…','textarea']],method:'Une explication professionnelle doit être <strong>compréhensible</strong>, <strong>exacte</strong> et indiquer les <strong>limites</strong> de ce que les chiffres permettent de conclure.'}
]},
{phase:'RÉINVESTIR',name:'Mission de synthèse',title:'Construire <em>une note technique</em>',subtitle:'Réutiliser les conversions, les calculs et le vocabulaire dans un document final.',mins:12,steps:[
{id:'10a',kind:'fields',doc:'mission',title:'Préparer les calculs de la fiche C',body:'Une troisième fiche d’étude fictive indique <strong>11 g</strong> et <strong>600 m/s</strong>. Convertis la masse en kilogrammes et calcule le carré de la vitesse.',fields:[['m','Masse convertie','kg','Ton résultat','number'],['v2','Carré de la vitesse','','Ton résultat','number']],method:'Commence systématiquement par vérifier les <strong>unités</strong>. La formule demande une masse en kg et une vitesse en m/s.'},
{id:'10b',kind:'fields',doc:'mission',title:'Calculer et interpréter l’énergie',body:'Calcule l’énergie cinétique de la fiche C en joules, puis explique en une phrase <strong>quelles grandeurs</strong> ont été utilisées.',fields:[['e','Énergie cinétique de la fiche C','J','Ton résultat','number'],['expl','Ma phrase d’interprétation','','Pour calculer cette énergie, j’ai utilisé…','textarea']],method:'Le résultat d’un calcul ne suffit pas : il doit être accompagné de son <strong>unité</strong> et d’une phrase indiquant ce qui a été calculé.'},
{id:'10c',kind:'report',doc:'mission',title:'Rédiger ta note de synthèse',body:'Complète les trois rubriques. Ta note se construit directement à l’écran. Elle doit pouvoir être comprise par un client sans qu’il ait assisté au cours.',fields:[['method','Méthode suivie','','J’ai d’abord…','textarea'],['result','Résultat et interprétation','','L’énergie calculée vaut…','textarea'],['limit','Limite du document','','Ces données ne suffisent pas à…','textarea']],method:'Une note de synthèse claire expose <strong>la méthode</strong>, <strong>le résultat avec son unité</strong> et <strong>ce que le document ne permet pas de conclure</strong>.'}
]}
];
const groups=['DÉCOUVRIR','COMPRENDRE','CALCULER','EXPÉRIMENTER','INTERPRÉTER','RÉINVESTIR'];
const allSteps=lessons.flatMap((l,li)=>l.steps.map((s,si)=>({l,li,s,si})));
const storageKey='stud-eval-bma-atelier-v3';
let saveData={};try{const p=JSON.parse(localStorage.getItem(storageKey)||'{}');if(p&&typeof p==='object')saveData=p;}catch(e){}
let li=0,si=0;let plotFocus='A';let toastTimer=null;
const $=(s)=>document.querySelector(s);
const h=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getStep(){return lessons[li].steps[si]}
function getResponse(id=getStep().id){return saveData[id]||{}}
function put(k,v){const s=getStep();saveData[s.id]??={};saveData[s.id][k]=v;try{localStorage.setItem(storageKey,JSON.stringify(saveData))}catch(e){}renderProgress()}
function filled(v){return v!==undefined && v!==null && (Array.isArray(v)?v.length>0:String(v).trim()!=='')}
function done(s){const a=getResponse(s.id);if(s.kind==='order')return (a.order||[]).length===s.items.length;if(s.kind==='classify')return s.items.every((_,i)=>filled(a['c'+i]));if(s.kind==='plot')return ['A','B','C','D'].every(x=>a['p'+x]!==undefined);if(s.kind==='mark')return !!a.point&&filled(a.explain);if(s.kind==='choice')return filled(a.choice);if(s.kind==='choiceText')return filled(a.choice)&&filled(a.explain);if(s.kind==='report')return s.fields.every(f=>filled(a[f[0]]));return (s.fields||[]).every(f=>filled(a[f[0]]));}
function partial(s){return Object.keys(getResponse(s.id)).some(k=>filled(getResponse(s.id)[k]));}
function renderProgress(){const count=allSteps.filter(x=>done(x.s)).length;$('#totalProgress').textContent=count+' / '+allSteps.length+' réponses';$('#trackProgress').style.width=(100*count/allSteps.length)+'%';$('#sidebar').innerHTML=groups.map(g=>`<div class="side-section">${h(g)}</div>`+lessons.map((l,index)=>l.phase!==g?'':`<button type="button" class="module-link ${index===li?'active':''} ${l.steps.every(done)?'done':''}" data-lesson="${index}" aria-label="Activité ${index+1} : ${h(l.name)}"><span class="num">${l.steps.every(done)?'✓':String(index+1).padStart(2,'0')}</span><span class="mod-name">${h(l.name)}</span><span class="mod-count">${l.steps.filter(done).length}/${l.steps.length}</span></button>`).join('')).join('')+`<div class="side-bottom"><span class="dot-green"></span>Réponses enregistrées sur cet appareil.<br>Aucune correction ni note affichée.</div>`;$('#footerDots').innerHTML=lessons[li].steps.map((s,j)=>`<i class="${j===si?'active':done(s)?'done':''}"></i>`).join('');}
function render(){const l=lessons[li],s=getStep();$('#crumbs').innerHTML=`ATELIER DE SCIENCES <span style="color:#b1bdce">/</span> <strong>${h(l.phase)}</strong> <span style="color:#b1bdce">/</span> ACTIVITÉ ${String(li+1).padStart(2,'0')}`;$('#pageTitle').innerHTML=l.title;$('#pageSubtitle').textContent=l.subtitle;$('#timePill').textContent='◷ '+l.mins+' min · '+l.steps.length+' étapes';$('#stepNav').innerHTML='<span class="step-caption">ÉTAPES</span>'+l.steps.map((step,i)=>`<button type="button" data-step="${i}" class="step-chip ${i===si?'active':done(step)?'finished':''}" aria-label="Aller à l’étape ${i+1}">${done(step)&&i!==si?'✓':i+1}</button>`).join('')+'<span class="step-caption end">Choisis une étape pour revenir à ta réponse.</span>';
$('#docKind').textContent=docLabels[s.doc]||'DOCUMENT';$('#docArea').innerHTML=renderDoc(s);$('#responseArea').innerHTML=renderTask(s);$('#methodText').innerHTML=s.method;$('#footerTitle').textContent=`Activité ${li+1} · Étape ${si+1} sur ${l.steps.length}`;$('#prevBtn').disabled=li===0&&si===0;$('#nextBtn').textContent=li===lessons.length-1&&si===l.steps.length-1?'Terminer le parcours ✓':'Enregistrer et continuer →';renderProgress();updateStatus();}
const docLabels={ficheA:'FICHE FICTIVE',conversion:'UNITÉS',formula:'FORMULE',calcA:'DÉMARCHE',comparison:'DEUX FICHES',slider:'SIMULATION',lab:'TABLEAU',plot:'GRAPHIQUE',trajectory:'SCHÉMA',analysis:'LECTURE CRITIQUE',mission:'DOCUMENT FINAL'};
function renderDoc(s){switch(s.doc){
case 'ficheA': return ficCard('A','10','700');
case 'conversion':return `<div class="conversion-card"><span class="pillblue">RAPPEL D’UNITÉS</span><div class="formula-large"><span>1 000</span> g = <span>1</span> kg</div><div class="equivalence"><b>g</b> ÷ 1 000 → <b>kg</b></div></div><div class="unit-cards"><div class="unit-card"><span>Exemple de méthode (autre valeur)</span><strong>25 g</strong></div><div class="unit-card"><span>25 ÷ 1 000 =</span><strong>0,025 kg</strong></div></div><div class="viz-note">La virgule décimale est acceptée dans les réponses.</div>`;
case 'formula':return `<div class="big-formula">E<sub>c</sub> = <strong>½</strong> × m × v<sup>2</sup></div><div class="formula-key"><div><b>E<sub>c</sub></b><span>Énergie cinétique, en joules (J)</span></div><div><b>m</b><span>Masse, en kilogrammes (kg)</span></div><div><b>v</b><span>Vitesse, en mètres par seconde (m/s)</span></div></div><div class="callout">On élève <strong>la vitesse</strong> au carré. Le résultat final s’exprime en joules.</div>`;
case 'calcA':return `<div class="metric-card"><div class="metric-top">FICHE D’ÉTUDE A · DONNÉES FICTIVES</div><div class="metric-pair"><div class="metric" style="cursor:default"><div class="metric-name">Masse m</div><span class="metric-value">10 <span class="metric-unit">g</span></span></div><div class="metric" style="cursor:default"><div class="metric-name">Vitesse v</div><span class="metric-value">700 <span class="metric-unit">m/s</span></span></div></div></div><div class="calc-steps"><div class="calc-step"><b>01</b><span><strong>Convertir</strong> la masse en kilogrammes</span></div><div class="calc-step"><b>02</b><span><strong>Calculer</strong> le carré de la vitesse</span></div><div class="calc-step"><b>03</b><span><strong>Appliquer</strong> la formule de l’énergie</span></div></div>`;
case 'comparison':return `<div class="cmp-cols"><div class="cmp"><small>FICHE A</small><b>10 g</b><span>700 m/s</span></div><div class="cmp"><small>FICHE B</small><b>12 g</b><span>650 m/s</span></div></div><div class="big-formula" style="font-size:23px">E<sub>c</sub> = <strong>½</strong> × m × v<sup>2</sup></div><div class="callout">Les deux situations sont <strong>inventées pour apprendre à calculer</strong>. Il ne s’agit pas de comparer des produits réels.</div>`;
case 'slider':return renderSlider();
case 'lab':return renderLab();
case 'plot':return renderPlot();
case 'trajectory':return renderTraj();
case 'analysis':return `<div class="metric-card"><div class="metric-top">DOCUMENT TECHNIQUE SIMPLIFIÉ · DONNÉES FICTIVES</div><div class="metric-pair"><div class="metric" style="cursor:default"><div class="metric-name">Masse</div><div class="metric-value">10 <span class="metric-unit">g</span></div></div><div class="metric" style="cursor:default"><div class="metric-name">Vitesse</div><div class="metric-value">700 <span class="metric-unit">m/s</span></div></div></div></div><div class="info-block"><strong>Ce que montre un document</strong><br>Une fiche peut indiquer des grandeurs et leurs unités. En revanche, <strong>toutes les conclusions</strong> ne peuvent pas être tirées de ces seules valeurs.</div><div class="concept">Une interprétation rigoureuse distingue <b>ce qui est écrit</b> de <b>ce qu’on suppose</b>.</div>`;
case 'mission':return `<div class="metric-card"><div class="metric-top">MISSION FINALE · FICHE C FICTIVE</div><div class="metric-title">Rédiger une note technique</div><div class="metric-desc">Sciences physiques · Document pédagogique</div><div class="metric-pair"><div class="metric" style="cursor:default"><div class="metric-name">Masse</div><div class="metric-value">11 <span class="metric-unit">g</span></div></div><div class="metric" style="cursor:default"><div class="metric-name">Vitesse</div><div class="metric-value">600 <span class="metric-unit">m/s</span></div></div></div></div><div class="big-formula" style="font-size:23px">E<sub>c</sub> = <strong>½</strong> × m × v<sup>2</sup></div><div class="viz-note">Les données sont fictives : aucune distance, trajectoire réelle ou consigne de tir n’en découle.</div>`;
default:return ''}}
function ficCard(name,m,v){const a=getResponse();return `<div class="metric-card"><div class="metric-top">DOCUMENT D’ÉTUDE · AUCUN PRODUIT RÉEL</div><div class="metric-title">Fiche de données ${name}</div><div class="metric-desc">Clique sur une valeur pour la mettre en évidence.</div><div class="metric-pair"><button type="button" class="metric ${a.metric==='mass'?'chosen':''}" data-metric="mass"><div class="metric-name">MASSE</div><span class="metric-value">${m} <span class="metric-unit">g</span></span></button><button type="button" class="metric ${a.metric==='speed'?'chosen':''}" data-metric="speed"><div class="metric-name">VITESSE</div><span class="metric-value">${v} <span class="metric-unit">m/s</span></span></button></div><div class="metric-tip">Données inventées pour s’entraîner à lire une fiche professionnelle.</div></div><div class="unit-cards"><div class="unit-card"><span>g</span><strong>gramme</strong></div><div class="unit-card"><span>m/s</span><strong>mètre par seconde</strong></div></div>`}
function renderLab(){return `<div><span class="pillblue">MESURES DE LABORATOIRE · FICTIVES</span></div><table class="data-table"><thead><tr><th>Mesure</th><th>Vitesse (m/s)</th></tr></thead><tbody>${[['A',40],['B',36],['C',32],['D',28]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table><div class="info-block">Les vitesses correspondent à un <strong>objet d’étude de laboratoire</strong> fictif, et non à des distances de tir.</div>`}
function sliderVisual(v){const pts=Array.from({length:51},(_,i)=>{const x=40+i/50*350,y=180-(Math.pow((i/50),2)*133);return `${i===0?'M':'L'}${x.toFixed(1)} ${y.toFixed(1)}`}).join(' ');const cx=40+(v/20)*350,cy=180-(v/20)**2*133;return `<svg viewBox="0 0 430 225" role="img" aria-label="Courbe de l’énergie en fonction de la vitesse, masse constante"><g stroke="#dce6f4" stroke-width="1">${[50,90,130,170].map(y=>`<line x1="40" x2="398" y1="${y}" y2="${y}"/>`).join('')}${[110,180,250,320,390].map(x=>`<line x1="${x}" x2="${x}" y1="25" y2="180"/>`).join('')}</g><path d="M40 22V180H404" fill="none" stroke="#7b8ca3" stroke-width="1.8"/><path d="${pts}" stroke="#175de8" stroke-width="3" fill="none" stroke-linecap="round"/><line x1="${cx}" y1="${cy}" x2="${cx}" y2="180" stroke="#f0a060" stroke-dasharray="4 4"/><circle cx="${cx}" cy="${cy}" r="7" fill="#ee893e" stroke="white" stroke-width="3"/><text x="48" y="20" fill="#6e85a0" font-size="11" font-weight="700">Énergie (J) · échelle illustrative</text><text x="286" y="209" fill="#6e85a0" font-size="11" font-weight="700">Vitesse (m/s)</text></svg>`}
function renderSlider(){let a=getResponse(),v=+(a.slider||10);return `<div class="range-header"><span>Vitesse de l’objet</span><span id="rangeVal">${v} m/s</span></div><input type="range" class="range" id="experimentSlider" min="1" max="20" step="1" value="${v}" aria-label="Vitesse de l’objet de laboratoire"><div class="svg-wrap" id="sliderChart">${sliderVisual(v)}</div><div class="viz-note">Objet de laboratoire fictif · Masse constante de 2 kg. Déplace le curseur : <strong>la courbe réagit</strong> sans donner la solution des exercices.</div>`}
function renderPlot(){let a=getResponse();const focus=plotFocus;const grid=[0,10,20,30,40,50];const xMap={A:72,B:162,C:252,D:342};const points=Object.keys(xMap).filter(k=>a['p'+k]!==undefined).map(k=>{const y=190-Number(a['p'+k])/50*156;return `<circle cx="${xMap[k]}" cy="${y}" r="6" class="plot-mark"/><text x="${xMap[k]+9}" y="${y-7}" fill="#be672f" font-size="11" font-weight="800">${k}</text>`}).join('');return `<div class="chart-options"><span class="chart-instruction">Choisis le point à placer :</span>${Object.keys(xMap).map(k=>`<button type="button" data-plotfocus="${k}" class="picker ${k===focus?'selected':''}">${k}${a['p'+k]!==undefined?' ✓':''}</button>`).join('')}</div><div class="svg-wrap"><svg id="plotSvg" class="svg-interactive" tabindex="0" role="button" aria-label="Clique dans le graphique pour placer le point ${focus}" viewBox="0 0 420 230"><rect x="45" y="26" width="355" height="164" fill="transparent"/>${grid.map(t=>{const y=190-t/50*156;return `<line x1="48" x2="401" y1="${y}" y2="${y}" stroke="#e0e9f5"/><text x="15" y="${y+4}" fill="#7a8da5" font-size="11">${t}</text>`}).join('')}<path d="M48 29V190H400" stroke="#7186a0" fill="none" stroke-width="1.7"/>${Object.entries(xMap).map(([k,x])=>`<text x="${x}" y="208" text-anchor="middle" fill="#405b7d" font-size="12" font-weight="800">${k}</text>`).join('')}${points}<text x="51" y="17" fill="#536f94" font-size="11" font-weight="700">Vitesse (m/s)</text><text x="276" y="225" fill="#6d83a1" font-size="10">Mesure</text></svg></div><div class="viz-note">Clique à la hauteur voulue : ton point est placé sans indication de justesse. Si nécessaire, reclique pour le déplacer.</div>`}
function curveSvg(){const a=getResponse();const marker=a.point?`<circle cx="${a.point.x}" cy="${a.point.y}" r="7" fill="#ef8b3f" stroke="white" stroke-width="3"/><text x="${Math.min(410,a.point.x+10)}" y="${Math.max(20,a.point.y-12)}" fill="#b96c2b" font-size="11" font-weight="800">Ton repère</text>`:'';return `<svg id="trajectorySvg" class="svg-interactive" tabindex="0" role="button" aria-label="Schéma cliquable de ligne de visée et trajectoire schématique" viewBox="0 0 450 235"><g stroke="#e7edf7">${[40,85,130,175,220].map(y=>`<line x1="12" x2="440" y1="${y}" y2="${y}"/>`).join('')}${[55,120,185,250,315,380].map(x=>`<line y1="15" y2="220" x1="${x}" x2="${x}"/>`).join('')}</g><line x1="25" y1="158" x2="429" y2="158" stroke="#175de8" stroke-width="3" stroke-linecap="round"/><path d="M25 197 C 91 150 135 110 219 112 C 316 114 361 173 429 213" stroke="#eb893c" stroke-width="3.5" stroke-linecap="round" fill="none"/><text x="32" y="145" fill="#175de8" font-size="11" font-weight="780">Ligne de visée</text><text x="207" y="91" fill="#ce7634" font-size="11" font-weight="780">Trajectoire</text>${marker}<text x="119" y="232" fill="#8b9db3" font-size="10">Schéma sans échelle ni distance réelle</text></svg>`}
function renderTraj(){return `<div class="svg-wrap">${curveSvg()}</div><div class="unit-cards"><div class="unit-card"><span><span style="display:inline-block;width:21px;height:3px;background:#175de8;vertical-align:middle;margin-right:8px"></span>Droite bleue</span><strong>Visée</strong></div><div class="unit-card"><span><span style="display:inline-block;width:21px;height:3px;background:#eb893c;vertical-align:middle;margin-right:8px"></span>Courbe orange</span><strong>Trajectoire</strong></div></div><div class="viz-note">Clique sur le graphique lorsque la consigne te demande de placer un repère. Le schéma est purement conceptuel.</div>`}
function formFields(s){const a=getResponse();return `<div class="form-stack">${(s.fields||[]).map((f,index)=>{const [id,label,unit,ph,type,opts]=f;const v=a[id]??'';return `<label class="field"><span class="field-label">${h(label)}</span>${type==='textarea'?`<textarea class="answer-textarea" data-field="${h(id)}" rows="3" placeholder="${h(ph)}">${h(v)}</textarea>`:type==='select'?`<select class="answer-select" data-field="${h(id)}"><option value="">${h(ph)}</option>${opts.map(o=>`<option value="${h(o)}" ${v===o?'selected':''}>${h(o)}</option>`).join('')}</select>`:`<span class="input-wrap ${unit?'has-unit':''}"><input class="answer-input" type="text" inputmode="decimal" autocomplete="off" data-field="${h(id)}" value="${h(v)}" placeholder="${h(ph)}">${unit?`<span class="suffix">${h(unit)}</span>`:''}</span>`}</label>`}).join('')}</div>`}
function renderTask(s){let a=getResponse();let html=`<div class="question-number">ÉTAPE ${si+1} / ${lessons[li].steps.length}</div><h2 class="task-title">${s.title}</h2><p class="task-body">${s.body}</p>`;
switch(s.kind){
case 'fields':html+=formFields(s);break;
case 'choice':case 'choiceText':html+=`<div class="choice-list">${s.options.map((x,i)=>`<button type="button" class="choice ${a.choice===x?'active':''}" data-choice="${h(x)}"><span class="choice-circle">${a.choice===x?'✓':''}</span><span>${h(x)}</span></button>`).join('')}</div>`;if(s.kind==='choiceText')html+=`<label class="field" style="margin-top:13px"><span class="field-label">${h(s.fieldLabel)}</span><textarea class="answer-textarea" data-field="explain" rows="3" placeholder="${h(s.placeholder)}">${h(a.explain||'')}</textarea></label>`;break;
case 'order':{const order=a.order||[];html+=`<span class="field-label">Actions disponibles</span><div class="picker-list" style="margin-top:8px">${s.items.map((x,i)=>`<button type="button" class="picker ${order.includes(i)?'selected':''}" data-order="${i}" ${order.includes(i)?'disabled':''}>${order.includes(i)?'✓ ':''}${h(x)}</button>`).join('')}</div><span class="field-label" style="margin-top:18px">Ma démarche</span><div class="order-stack">${order.length?order.map((id,i)=>`<div class="order-item"><span class="order-index">${i+1}</span>${h(s.items[id])}</div>`).join(''):'<div class="small-round">Clique sur une action ci-dessus pour construire ta démarche.</div>'}</div><button class="linklike" id="clearOrder" type="button">↶ Effacer et recommencer</button>`;break;}
case 'classify':html+=s.items.map((x,i)=>`<div class="classify-card"><div class="classify-statement">${i+1}. ${h(x)}</div><div class="classify-actions"><button type="button" data-classify="${i}" data-kind="fact" class="${a['c'+i]==='fact'?'active':''}">Justifié par les données</button><button type="button" data-classify="${i}" data-kind="not" class="${a['c'+i]==='not'?'active':''}">Non déductible</button></div></div>`).join('');break;
case 'plot':html+=`<div class="info-block"><strong>Manipulation sur le graphique de gauche</strong><br>1. Choisis le point A, B, C ou D.<br>2. Clique sur la hauteur voulue.<br>3. Recommence pour les quatre points.</div><div class="small-round" style="margin-top:12px">Points placés : <strong id="plotCount">${['A','B','C','D'].filter(k=>a['p'+k]!==undefined).length} sur 4</strong></div>`;break;
case 'mark':html+=`<div class="info-block"><strong>Manipulation</strong><br>Clique directement sur la courbe du document à gauche. Le marqueur mémorise ton choix ; tu peux le déplacer en cliquant de nouveau.</div><label class="field" style="margin-top:14px"><span class="field-label">${h(s.fieldLabel)}</span><textarea class="answer-textarea" data-field="explain" rows="3" placeholder="${h(s.placeholder)}">${h(a.explain||'')}</textarea></label>`;break;
case 'report':html+=formFields(s);html+=`<div class="small-round" style="margin-top:11px">Ta note est enregistrée automatiquement pendant la rédaction. Tu peux l’exporter depuis « Mes réponses ».</div>`;break;
}
return html+`<div class="status ${done(s)?'ready':''}" id="responseStatus">${done(s)?'✓ Réponse enregistrée · sans correction':'○ Ton travail est enregistré automatiquement'}</div>`}
function updateStatus(){const e=$('#responseStatus');if(!e)return;const d=done(getStep());e.className='status '+(d?'ready':'');e.textContent=d?'✓ Réponse enregistrée · sans correction':'○ Ton travail est enregistré automatiquement';}
function navigate(delta){let nextLi=li,nextSi=si+delta;if(nextSi>=lessons[li].steps.length){nextLi++;nextSi=0}if(nextSi<0){nextLi--;if(nextLi>=0)nextSi=lessons[nextLi].steps.length-1}if(nextLi<0||nextLi>=lessons.length){if(delta>0){showFinish()}return}li=nextLi;si=nextSi;plotFocus='A';render();window.scrollTo({top:0,behavior:'instant'});}
function showFinish(){const count=allSteps.filter(x=>done(x.s)).length;$('#finishMessage').textContent=`Tu as renseigné ${count} étape${count>1?'s':''} sur ${allSteps.length}. Tes réponses sont conservées sur cet appareil, sans note ni correction automatique. Tu peux revenir compléter une étape ou exporter ton travail.`;$('#finishModal').classList.add('open');$('#finishModal').setAttribute('aria-hidden','false');$('#finishBack').focus()}
$('#finishBack').addEventListener('click',()=>{$('#finishModal').classList.remove('open');$('#finishModal').setAttribute('aria-hidden','true');$('#nextBtn').focus()});
$('#finishExport').addEventListener('click',()=>$('#exportBtn').click());
$('#finishModal').addEventListener('click',e=>{if(e.target.id==='finishModal')$('#finishBack').click()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#finishModal').classList.contains('open'))$('#finishBack').click()});
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('visible'),2700)}
$('#sidebar').addEventListener('click',e=>{const b=e.target.closest('[data-lesson]');if(!b)return;li=Number(b.dataset.lesson);si=0;plotFocus='A';render();window.scrollTo({top:0,behavior:'instant'})});
$('#stepNav').addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(!b)return;si=Number(b.dataset.step);plotFocus='A';render()});
$('#prevBtn').addEventListener('click',()=>navigate(-1));$('#nextBtn').addEventListener('click',()=>{if(!done(getStep())){showToast('Tu peux continuer : les cases non remplies restent disponibles.')}navigate(1)});
$('#responseArea').addEventListener('input',e=>{const fld=e.target.closest('[data-field]');if(!fld)return;put(fld.dataset.field,fld.value);updateStatus()});
$('#responseArea').addEventListener('change',e=>{const fld=e.target.closest('[data-field]');if(!fld)return;put(fld.dataset.field,fld.value);updateStatus()});
$('#responseArea').addEventListener('click',e=>{let b=e.target.closest('[data-choice]');if(b){put('choice',b.dataset.choice);$('#responseArea').querySelectorAll('[data-choice]').forEach(c=>{const on=c===b;c.classList.toggle('active',on);c.querySelector('.choice-circle').textContent=on?'✓':''});updateStatus();return}
b=e.target.closest('[data-order]');if(b){let a=getResponse(),n=Number(b.dataset.order);a.order??=[];if(!a.order.includes(n)){a.order.push(n);put('order',a.order);$('#responseArea').innerHTML=renderTask(getStep());renderProgress()}return}
if(e.target.closest('#clearOrder')){put('order',[]);$('#responseArea').innerHTML=renderTask(getStep());return}
b=e.target.closest('[data-classify]');if(b){const id=Number(b.dataset.classify),k=b.dataset.kind;put('c'+id,k);b.closest('.classify-actions').querySelectorAll('button').forEach(btn=>btn.classList.toggle('active',btn.dataset.kind===k));updateStatus();return}});
$('#docArea').addEventListener('click',e=>{let b=e.target.closest('[data-metric]');if(b){put('metric',b.dataset.metric);$('#docArea').querySelectorAll('[data-metric]').forEach(x=>x.classList.toggle('chosen',x===b));return}b=e.target.closest('[data-plotfocus]');if(b){plotFocus=b.dataset.plotfocus;$('#docArea').innerHTML=renderDoc(getStep());return}
const sv=e.target.closest('#plotSvg');if(sv){const r=sv.getBoundingClientRect(),sy=(e.clientY-r.top)/r.height*230;let spd=Math.max(0,Math.min(50,(190-sy)/156*50));put('p'+plotFocus,Math.round(spd*10)/10);$('#docArea').innerHTML=renderDoc(getStep());$('#responseArea').innerHTML=renderTask(getStep());return}
const tr=e.target.closest('#trajectorySvg');if(tr&&['mark'].includes(getStep().kind)){const r=tr.getBoundingClientRect();let x=Math.max(10,Math.min(440,(e.clientX-r.left)/r.width*450));let y=Math.max(10,Math.min(225,(e.clientY-r.top)/r.height*235));put('point',{x:Math.round(x),y:Math.round(y)});$('#docArea').innerHTML=renderDoc(getStep());updateStatus()}}
);
$('#docArea').addEventListener('input',e=>{if(e.target.id==='experimentSlider'){const v=Number(e.target.value);put('slider',v);$('#rangeVal').textContent=v+' m/s';$('#sliderChart').innerHTML=sliderVisual(v)}});
$('#docArea').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&(e.target.id==='plotSvg'||e.target.id==='trajectorySvg')){e.preventDefault();const r=e.target.getBoundingClientRect();const ev=new MouseEvent('click',{bubbles:true,clientX:r.left+r.width*.55,clientY:r.top+r.height*.5});e.target.dispatchEvent(ev)}});
$('#exportBtn').addEventListener('click',()=>{let out='STUD’ÉVAL — BMA ARMURERIE\nATELIER DE SCIENCES APPLIQUÉES\nMes réponses (sans correction automatique)\n'+'='.repeat(60)+'\n\n';lessons.forEach((l,i)=>{out+=`ACTIVITÉ ${i+1} — ${l.name}\n`;l.steps.forEach((s,j)=>{const a=getResponse(s.id);out+=`  ${j+1}. ${s.title}\n`;if(s.kind==='choice'||s.kind==='choiceText')out+=`     Choix : ${a.choice||'(vide)'}\n`;if(s.kind==='choiceText'||s.kind==='mark')out+=`     Explication : ${a.explain||'(vide)'}\n`;if(s.kind==='order')out+=`     Ordre : ${(a.order||[]).map(k=>s.items[k]).join(' → ')||'(vide)'}\n`;if(s.kind==='classify')s.items.forEach((it,k)=>out+=`     ${it} : ${a['c'+k]==='fact'?'Justifié':a['c'+k]==='not'?'Non déductible':'(vide)'}\n`);if(s.fields)s.fields.forEach(f=>out+=`     ${f[1]} : ${a[f[0]]||'(vide)'} ${f[2]||''}\n`);if(s.kind==='plot')out+=`     Points : ${['A','B','C','D'].map(k=>k+' = '+(a['p'+k]??'(vide)')).join(' ; ')}\n`;if(s.kind==='mark')out+=`     Repère : ${a.point?`position schématique (${a.point.x} ; ${a.point.y})`:'(vide)'}\n`;out+='\n'})});out+='Données fictives. Aucun réglage ou résultat balistique réel.\n';const blob=new Blob(['\ufeff'+out],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const anchor=document.createElement('a');anchor.href=url;anchor.download='StudEval_BMA_mes_reponses.txt';document.body.appendChild(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),500);showToast('Tes réponses ont été exportées. Aucune correction incluse.')});
render();
</script>
</body>
</html>
